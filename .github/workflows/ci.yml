name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.3.0
      - uses: jdx/mise-action@v4.3.0
      - name: Install build dependencies (for hk)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libreadline-dev pkg-config
      - run: mise run ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}